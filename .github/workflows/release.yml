name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume (package sources must match)
        required: true
        type: string
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  check_branch:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.permitted.outputs.result }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Fetch remote branches
        run: |
          git fetch origin --depth=1

      - name: Check if on permitted branch
        id: permitted
        run: |
          result=
          if git branch -a --contains "$GITHUB_SHA" | grep -q 'remotes/origin/master$'; then
            result=true
          elif git branch -a --contains "$GITHUB_SHA" | grep -Eq 'remotes/origin/[0-9]+\.[0-9]+-release$'; then
            result=true
          fi
          echo "result=${result}" >> "$GITHUB_OUTPUT"

  release:
    timeout-minutes: 45
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    needs: check_branch
    permissions:
      contents: write
      id-token: write

    if: ${{ github.repository_owner == 'visgl' && needs.check_branch.outputs.should_build }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate release source before recovery
        run: node scripts/publish-from-git.mjs --check --tag "$RELEASE_TAG"

      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn -v

      - name: Cache Yarn Berry artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify publishing stack and retry guards
        run: |
          node scripts/check-publishing-stack.mjs
          node --test scripts/publish-from-git.test.mjs

      - name: Build packages
        run: npm run build

      - name: Install Playwright Chromium
        run: yarn playwright:install

      - name: Run release test suite
        run: yarn test

      - name: Publish to NPM
        run: node scripts/publish-from-git.mjs --tag "$RELEASE_TAG"
