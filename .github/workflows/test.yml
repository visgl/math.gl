name: test

# On every pull request, but only on push to master
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node (with Corepack)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn -v

      - name: Cache Yarn Berry artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check generated CRS declarations
        run: yarn check:projjson-types

      - name: Build code
        run: yarn build

      - name: Check GeoArrow package boundary
        run: yarn check:geoarrow-boundary

      - name: Check CRS type boundaries
        run: yarn check:crs-types

      - name: Install Playwright Chromium
        run: yarn playwright:install

      - name: Run Node tests
        run: yarn test-node

      - name: Run headless tests with coverage
        run: yarn test-coverage

      - name: Run lint
        run: yarn lint

      - name: Build website
        run: yarn workspace project-website build

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false

      - name: Publish coverage check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COVERAGE_FILE: coverage/lcov.info
          MINIMUM_LINES: 90
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const lcov = fs.readFileSync(process.env.COVERAGE_FILE, 'utf8');
            const records = lcov.split('end_of_record');
            const totals = records.reduce(
              (result, record) => {
                const linesFound = Number(record.match(/^LF:(\d+)$/m)?.[1] || 0);
                const linesHit = Number(record.match(/^LH:(\d+)$/m)?.[1] || 0);
                return {found: result.found + linesFound, hit: result.hit + linesHit};
              },
              {found: 0, hit: 0}
            );
            const percentage = totals.found ? (100 * totals.hit) / totals.found : 0;
            const minimum = Number(process.env.MINIMUM_LINES);
            const conclusion = percentage >= minimum ? 'success' : 'failure';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request?.head.sha || context.sha;

            await github.rest.checks.create({
              owner,
              repo,
              name: 'coverage',
              head_sha: headSha,
              status: 'completed',
              conclusion,
              output: {
                title: `${percentage.toFixed(2)}% line coverage`,
                summary: `Coverage is ${conclusion === 'success' ? 'above' : 'below'} the ${minimum}% minimum.`,
                text: `**${totals.hit.toLocaleString()} / ${totals.found.toLocaleString()}** instrumented lines are covered.\n\n[View the detailed Coveralls report](https://coveralls.io).`
              }
            });
