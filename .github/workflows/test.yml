name: test

# On every pull request, but only on push to master
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node (with Corepack)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn -v

      - name: Cache Yarn Berry artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check source license and copyright headers
        run: yarn check:source-headers

      - name: Check independent interior references and qualification
        run: |
          python3 modules/projection/scripts/generate-interior-reference.py --check
          node modules/projection/scripts/qualify-interiors.mjs --output /tmp/interior-qualification.json

      - name: Check independent deformation stress references and qualification
        run: |
          python3 modules/projection/scripts/generate-deformation-stress-reference.py --check
          python3 modules/projection/scripts/generate-temporal-reference.py --check
          node modules/projection/scripts/qualify-deformation-stress.mjs --output /tmp/deformation-stress-qualification.json
          node modules/projection/scripts/check-application-deformation-qualification.mjs

      - name: Check generated CRS declarations
        run: yarn check:projjson-types

      - name: Test website dependency resolution
        run: node --test website/resolve-math-gl-dependency.test.cjs

      # Match website deployment: build from source before any package dist files exist.
      - name: Build website
        run: yarn workspace project-website build

      - name: Build next website
        env:
          WEBSITE_BASE_URL: /math.gl/next/
        run: yarn workspace project-website build

      - name: Build code
        run: yarn build

      - name: Test tectonic time machine streaming
        run: yarn workspace math.gl-tectonic-time-machine test

      - name: Test Alpine Ice Age dataset and interpolation
        run: yarn workspace math.gl-alpine-ice-age test

      - name: Check curves package exports, public types and tree shaking
        run: yarn check:curves-package

      - name: Check spatial index POC package
        run: yarn check:spatial-index-package

      - name: Check parametric geometry package
        run: yarn check:parametric-package

      - name: Check tile-matrix subpath exports, public types and dependency boundary
        run: yarn check:tile-matrix-package

      - name: Check GeoArrow package boundary
        run: yarn check:geoarrow-boundary

      - name: Check timezone package boundaries and public types
        run: |
          yarn check:timezone-boundary
          yarn check:timezone-types

      - name: Check WKB package boundary
        run: yarn check:wkb-boundary

      - name: Check projection parity inventory and package boundaries
        run: |
          node modules/projection/scripts/check-attribution.mjs
          node modules/projection/scripts/audit-allocations.mjs --check
          node modules/projection/scripts/check-spheroid-allocations.mjs
          node modules/projection/scripts/check-spheroid-boundary.mjs
          node modules/projection/scripts/check-local-frame-allocations.mjs
          node modules/projection/scripts/check-local-frame-boundary.mjs
          node modules/projection/scripts/check-parity-inventory.mjs
          node modules/projection/scripts/check-native-reference.mjs
          node modules/projection/scripts/check-vertical-reference.mjs
          node modules/projection/scripts/check-vertical-geotiff-reference.mjs
          node modules/projection/scripts/check-pipeline-reference.mjs
          node modules/projection/scripts/check-kinematic-reference.mjs
          node modules/projection/scripts/check-deformation-reference.mjs
          node modules/projection/scripts/measure-accuracy.mjs --output /tmp/projection-accuracy.json
          node modules/projection/scripts/check-experimental-package.mjs
          node modules/projection/scripts/check-packed-package.mjs
          node modules/projection/scripts/check-bundle-budget.mjs
          node modules/projection/scripts/check-lazy-package.mjs
          node modules/projection/scripts/benchmark.mjs --points 100 --samples 3 --min-sample-ms 0

      - name: Upload projection accuracy measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: projection-accuracy
          path: |
            /tmp/projection-accuracy.json
            /tmp/deformation-stress-qualification.json
          if-no-files-found: error

      - name: Check CRS type boundaries
        run: yarn check:crs-types

      # Keep browser downloads across runs; --with-deps still installs OS libraries.
      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('yarn.lock') }}

      - name: Install Chromium for coverage
        run: yarn playwright install --with-deps chromium

      - name: Check projection scorecard integrity and collect Node evidence
        timeout-minutes: 5
        env:
          SCORECARD_POINTS: ${{ github.event_name == 'pull_request' && '2000' || '20000' }}
          SCORECARD_SAMPLES: ${{ github.event_name == 'pull_request' && '3' || '7' }}
          SCORECARD_WINDOW: ${{ github.event_name == 'pull_request' && '4' || '12' }}
        run: |
          node --test modules/projection/scripts/scorecard.test.mjs
          node modules/projection/scripts/collect-scorecard-node.mjs --directory /tmp/projection-scorecard-node --points "$SCORECARD_POINTS" --samples "$SCORECARD_SAMPLES" --min-sample-ms "$SCORECARD_WINDOW"

      - name: Upload Node scorecard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: projection-scorecard-node
          path: /tmp/projection-scorecard-node
          if-no-files-found: error

      - name: Run Node tests
        run: yarn test-node

      - name: Run headless tests with coverage
        run: yarn test-coverage

      - name: Run lint
        run: yarn lint

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false

      - name: Publish coverage check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COVERAGE_FILE: coverage/lcov.info
          MINIMUM_LINES: 90
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const lcov = fs.readFileSync(process.env.COVERAGE_FILE, 'utf8');
            const records = lcov.split('end_of_record');
            const totals = records.reduce(
              (result, record) => {
                const linesFound = Number(record.match(/^LF:(\d+)$/m)?.[1] || 0);
                const linesHit = Number(record.match(/^LH:(\d+)$/m)?.[1] || 0);
                return {found: result.found + linesFound, hit: result.hit + linesHit};
              },
              {found: 0, hit: 0}
            );
            const percentage = totals.found ? (100 * totals.hit) / totals.found : 0;
            const minimum = Number(process.env.MINIMUM_LINES);
            const conclusion = percentage >= minimum ? 'success' : 'failure';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request?.head.sha || context.sha;

            await github.rest.checks.create({
              owner,
              repo,
              name: 'coverage',
              head_sha: headSha,
              status: 'completed',
              conclusion,
              output: {
                title: `${percentage.toFixed(2)}% line coverage`,
                summary: `Coverage is ${conclusion === 'success' ? 'above' : 'below'} the ${minimum}% minimum.`,
                text: `**${totals.hit.toLocaleString()} / ${totals.found.toLocaleString()}** instrumented lines are covered.\n\n[View the detailed Coveralls report](https://coveralls.io).`
              }
            });

  projection-browsers:
    name: Projection qualification (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    # Browser downloads can consume 12+ minutes; preserve time for qualification.
    # Individual qualification steps retain their stricter execution limits.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node (with Corepack)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn -v

      - name: Cache Yarn Berry artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build code
        run: yarn build

      # Keep browser downloads across runs; --with-deps still installs OS libraries.
      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('yarn.lock') }}

      - name: Install selected Playwright browser
        run: yarn playwright install --with-deps ${{ matrix.browser }}

      - name: Qualify independent interior and deformation references
        timeout-minutes: 2
        run: |
          node modules/projection/scripts/qualify-interiors.mjs --browser ${{ matrix.browser }} --output /tmp/interior-qualification-${{ matrix.browser }}.json
          node modules/projection/scripts/qualify-deformation-stress.mjs --browser ${{ matrix.browser }} --output /tmp/deformation-stress-qualification-${{ matrix.browser }}.json

      # Retain the complete matrix and three samples in PRs. A bounded 4 ms
      # window supports scorecard diagnostics; master retains the 12 ms profile.
      - name: Check browser projection correctness and performance
        timeout-minutes: 6
        env:
          BROWSER_SAMPLES: ${{ github.event_name == 'pull_request' && '3' || '7' }}
          BROWSER_MIN_SAMPLE_MS: ${{ github.event_name == 'pull_request' && '4' || '12' }}
        run: node modules/projection/scripts/benchmark-browser.mjs --browsers ${{ matrix.browser }} --points 20000 --samples "$BROWSER_SAMPLES" --min-sample-ms "$BROWSER_MIN_SAMPLE_MS" --output /tmp/projection-browser-qualification.json

      - name: Evaluate optional worker correctness and costs
        timeout-minutes: 2
        run: node modules/projection/scripts/benchmark-workers.mjs --browser ${{ matrix.browser }} --points 1000,100000 --samples 3 --output /tmp/projection-worker-evaluation-${{ matrix.browser }}.json

      - name: Upload browser qualification measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: projection-browser-qualification-${{ matrix.browser }}
          path: |
            /tmp/projection-browser-qualification.json
            /tmp/deformation-stress-qualification-${{ matrix.browser }}.json
            /tmp/interior-qualification-${{ matrix.browser }}.json
            /tmp/projection-worker-evaluation-${{ matrix.browser }}.json
          if-no-files-found: error

  projection-performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node (with Corepack)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn -v

      - name: Cache Yarn Berry artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build code
        run: yarn build

      # Retain all coordinates, layouts and 11 samples; bound adaptive timing windows.
      - name: Compare projection performance against the PR base
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node modules/projection/scripts/benchmark-compare.mjs --baseline-ref "$BASE_SHA" --points 20000 --samples 11 --min-sample-ms 4 --scenarios 'Web Mercator,Ellipsoidal Mercator,UTM 31N,Lambert conformal conic,Albers equal area,Equidistant conic,Seven-parameter datum shift,NTv2 horizontal grid,North/east axis order' --output /tmp/projection-performance-comparison.json

      # Keep every scenario/layout/direction and seven samples; bound aggregate windows
      # as reusable-output modes add implementations. Longer local runs keep the 12 ms default.
      - name: Compare pipeline performance against the PR base
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node modules/projection/scripts/benchmark-pipeline-compare.mjs --baseline-ref "$BASE_SHA" --points 10000 --samples 7 --min-sample-ms 4 --allocations --reusable-results --output /tmp/projection-pipeline-comparison.json

      - name: Check paired grid preparation benchmark
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node modules/projection/scripts/benchmark-grid-compare.mjs --baseline-ref "$BASE_SHA" --sizes 17,65 --samples 3 --coordinates --allocations --points 1000 --output /tmp/projection-grid-comparison.json

      - name: Compare spheroid conversion correctness and costs
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node modules/projection/scripts/benchmark-spheroid-compare.mjs --baseline-ref "$BASE_SHA" --points 1000 --samples 3 --min-sample-ms 0 --allocations --output /tmp/projection-spheroid-comparison.json

      - name: Compare shared local-frame correctness and costs
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node modules/projection/scripts/benchmark-local-frame-compare.mjs --baseline-ref "$BASE_SHA" --points 1000 --samples 3 --min-sample-ms 0 --allocations --output /tmp/projection-local-frame-comparison.json

      - name: Upload paired performance measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: projection-performance-comparison
          path: |
            /tmp/projection-performance-comparison.json
            /tmp/projection-pipeline-comparison.json
            /tmp/projection-grid-comparison.json
            /tmp/projection-spheroid-comparison.json
            /tmp/projection-local-frame-comparison.json
          if-no-files-found: error

  # Consolidate evidence and enforce the required check on one runner. This avoids
  # queueing another job after the scorecard has already completed. Publish the
  # diagnostic scorecard before enforcing the independent performance result.
  test:
    if: always()
    needs: [checks, projection-browsers, projection-performance]
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Checkout code
        if: success() && needs.checks.result == 'success' && needs.projection-browsers.result == 'success'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node
        if: success() && needs.checks.result == 'success' && needs.projection-browsers.result == 'success'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
      - name: Download Node evidence
        if: success() && needs.checks.result == 'success' && needs.projection-browsers.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: projection-scorecard-node
          path: /tmp/projection-scorecard-node
      - name: Download browser evidence
        if: success() && needs.checks.result == 'success' && needs.projection-browsers.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: projection-browser-qualification-*
          path: /tmp/projection-scorecard-browsers
      - name: Consolidate matched evidence
        if: success() && needs.checks.result == 'success' && needs.projection-browsers.result == 'success'
        run: |
          node modules/projection/scripts/scorecard.mjs --node /tmp/projection-scorecard-node \
            --browser-report /tmp/projection-scorecard-browsers/projection-browser-qualification-chromium/projection-browser-qualification.json \
            --browser-report /tmp/projection-scorecard-browsers/projection-browser-qualification-firefox/projection-browser-qualification.json \
            --browser-report /tmp/projection-scorecard-browsers/projection-browser-qualification-webkit/projection-browser-qualification.json \
            --output /tmp/projection-scorecard.json --markdown /tmp/projection-scorecard.md
      - name: Upload scorecard and publication page
        if: success() && needs.checks.result == 'success' && needs.projection-browsers.result == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: projection-scorecard
          path: |
            /tmp/projection-scorecard.json
            /tmp/projection-scorecard.md
          if-no-files-found: error

      - name: Require all checks to pass
        if: always()
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSERS_RESULT: ${{ needs.projection-browsers.result }}
          PERFORMANCE_RESULT: ${{ needs.projection-performance.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSERS_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$PERFORMANCE_RESULT" = success
          else
            test "$PERFORMANCE_RESULT" = skipped
          fi
