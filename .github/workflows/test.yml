name: test

# On every pull request, but only on push to master
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node (with Corepack)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn -v

      - name: Cache Yarn Berry artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check generated CRS declarations
        run: yarn check:projjson-types

      # Match website deployment: build from source before any package dist files exist.
      - name: Build website
        run: yarn workspace project-website build

      - name: Build next website
        env:
          WEBSITE_BASE_URL: /math.gl/next/
        run: yarn workspace project-website build

      - name: Build code
        run: yarn build

      - name: Check GeoArrow package boundary
        run: yarn check:geoarrow-boundary

      - name: Check timezone package boundaries and public types
        run: |
          yarn check:timezone-boundary
          yarn check:timezone-types

      - name: Check WKB package boundary
        run: yarn check:wkb-boundary

      - name: Check Proj4 parity inventory and package boundaries
        run: |
          node modules/proj4/scripts/check-parity-inventory.mjs
          node modules/proj4/scripts/check-native-reference.mjs
          node modules/proj4/scripts/measure-accuracy.mjs --output /tmp/proj4-accuracy.json
          node modules/proj4/scripts/check-experimental-package.mjs
          node modules/proj4/scripts/check-packed-package.mjs
          node modules/proj4/scripts/check-bundle-budget.mjs
          node modules/proj4/scripts/check-lazy-package.mjs
          node modules/proj4/scripts/benchmark.mjs --points 100 --samples 3 --min-sample-ms 0

      - name: Upload projection accuracy measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proj4-accuracy
          path: /tmp/proj4-accuracy.json
          if-no-files-found: error

      - name: Check CRS type boundaries
        run: yarn check:crs-types

      - name: Install Chromium for coverage
        run: yarn playwright install --with-deps chromium

      - name: Check native projection startup correctness
        run: node modules/proj4/scripts/benchmark-startup.mjs --samples 3

      - name: Run Node tests
        run: yarn test-node

      - name: Run headless tests with coverage
        run: yarn test-coverage

      - name: Run lint
        run: yarn lint

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false

      - name: Publish coverage check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COVERAGE_FILE: coverage/lcov.info
          MINIMUM_LINES: 90
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const lcov = fs.readFileSync(process.env.COVERAGE_FILE, 'utf8');
            const records = lcov.split('end_of_record');
            const totals = records.reduce(
              (result, record) => {
                const linesFound = Number(record.match(/^LF:(\d+)$/m)?.[1] || 0);
                const linesHit = Number(record.match(/^LH:(\d+)$/m)?.[1] || 0);
                return {found: result.found + linesFound, hit: result.hit + linesHit};
              },
              {found: 0, hit: 0}
            );
            const percentage = totals.found ? (100 * totals.hit) / totals.found : 0;
            const minimum = Number(process.env.MINIMUM_LINES);
            const conclusion = percentage >= minimum ? 'success' : 'failure';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request?.head.sha || context.sha;

            await github.rest.checks.create({
              owner,
              repo,
              name: 'coverage',
              head_sha: headSha,
              status: 'completed',
              conclusion,
              output: {
                title: `${percentage.toFixed(2)}% line coverage`,
                summary: `Coverage is ${conclusion === 'success' ? 'above' : 'below'} the ${minimum}% minimum.`,
                text: `**${totals.hit.toLocaleString()} / ${totals.found.toLocaleString()}** instrumented lines are covered.\n\n[View the detailed Coveralls report](https://coveralls.io).`
              }
            });

  projection-browsers:
    name: Projection qualification (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node (with Corepack)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn -v

      - name: Cache Yarn Berry artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build code
        run: yarn build

      - name: Install selected Playwright browser
        run: yarn playwright install --with-deps ${{ matrix.browser }}

      - name: Check browser projection correctness and performance
        timeout-minutes: 6
        run: node modules/proj4/scripts/benchmark-browser.mjs --browsers ${{ matrix.browser }} --points 20000 --samples 7 --output /tmp/proj4-browser-qualification.json

      - name: Upload browser qualification measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proj4-browser-qualification-${{ matrix.browser }}
          path: /tmp/proj4-browser-qualification.json
          if-no-files-found: error

  projection-performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node (with Corepack)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn -v

      - name: Cache Yarn Berry artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build code
        run: yarn build

      - name: Compare projection performance against the PR base
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node modules/proj4/scripts/benchmark-compare.mjs --baseline-ref "$BASE_SHA" --points 20000 --samples 11 --scenarios 'Web Mercator,Ellipsoidal Mercator,UTM 31N,Lambert conformal conic,Albers equal area,Equidistant conic,Seven-parameter datum shift,NTv2 horizontal grid,North/east axis order' --output /tmp/proj4-performance-comparison.json

      - name: Upload paired performance measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proj4-performance-comparison
          path: /tmp/proj4-performance-comparison.json
          if-no-files-found: error

  # Preserve the required check name and fail it if any qualification job fails.
  test:
    if: always()
    needs: [checks, projection-browsers, projection-performance]
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSERS_RESULT: ${{ needs.projection-browsers.result }}
          PERFORMANCE_RESULT: ${{ needs.projection-performance.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSERS_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$PERFORMANCE_RESULT" = success
          else
            test "$PERFORMANCE_RESULT" = skipped
          fi
